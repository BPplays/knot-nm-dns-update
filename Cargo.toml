[package]
name = "knot-nm-dns-update"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["unicode", "string", "derive", "env"] }
env_logger = "0.11.11"
http-body-util = { version = "0.1.5", features = ["full"] }
hyper = { version = "1.11.1", features = ["client", "full", "http2", "http1", "tracing"] }
hyper-util = { version = "0.1.20", features = ["client", "client-legacy", "full", "http2", "http1", "tokio", "tracing"] }
hyperlocal = { version = "0.9.1", features = ["hyper-util"] }
log = "0.4.34"
resolv-conf = "0.7.6"
serde_json = "1.0.151"
